name: 每日定时抓取组播直播源

于:
  schedule:
    # 每天 UTC 时间 20:00 (北京时间 早上 04:00) 自动触发
    - cron: '0 20 * * *'
  workflow_dispatch: # 支持在 GitHub 页面手动点击按钮触发运行

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 执行抓取脚本
        run: |
          python fetch_iptv.py

      - name: 提交并推送到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add combined_telecom_iptv.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update: 自动更新组播直播源 [$(date +'%Y-%m-%d %H:%M:%S')]" && git push)

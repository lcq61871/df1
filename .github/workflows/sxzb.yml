name: Run sx.py daily to filter IPTV streams

  schedule:
    # 每天 UTC 时间 0:00 和 12:00 运行（对应北京时间 8:00 和 20:00）
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 允许手动触发运行

permissions:
  contents: write

jobs:
  run_sx_script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run sx.py script
        run: |
          python sx.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add output_streams.txt || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update IPTV streams [$(date +'%Y-%m-%d %H:%M:%S')]" && git push)
